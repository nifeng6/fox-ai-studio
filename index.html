<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fox AI</title>
    <script>
      // Sync theme before any CSS paints to prevent dark→light flash
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          if (stored) {
            var parsed = JSON.parse(stored);
            var mode = parsed.mode || 'dark';
            if (mode === 'system') {
              mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('theme-mode', mode);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-background, #1e1e1e);
        transition: opacity 0.3s ease;
      }
      [theme-mode='light'] #splash { background: #f5f5f5; }
      #splash.fade-out { opacity: 0; pointer-events: none; }
      .splash-dots {
        display: flex;
        gap: 7px;
      }
      .splash-dots span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(255,255,255,0.3);
        animation: splash-dot 1.2s ease-in-out infinite;
      }
      [theme-mode='light'] .splash-dots span { background: rgba(0,0,0,0.2); }
      .splash-dots span:nth-child(2) { animation-delay: 0.15s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes splash-dot {
        0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
